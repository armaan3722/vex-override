[project]
name = "vex-override"
version = "0.4.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Armaan Sandhu", email = "103614886+armaan3722@users.noreply.github.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff==0.16.10",
    "ty>=0.0.84",
]

[tool.ruff]
extend-exclude = [".stubs/"]

[tool.ty.src]
exclude = [".stubs/"]

[tool.ty.environment]
extra-paths = [".stubs/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath =["src"]
addopts = ["-q", "--tb=no"]
